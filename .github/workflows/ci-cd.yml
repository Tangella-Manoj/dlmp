name: DLMP — CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dlmp

jobs:
  # ─── Stage 1: Tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn test --no-transfer-progress -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  # ─── Stage 2: Build & Push Docker images ────────────────────────────────────
  build-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api-gateway, user-service, loan-service, payment-service,
                  notification-service, report-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs (skip tests — already ran)
        run: mvn package -DskipTests --no-transfer-progress -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Stage 3: Security Scan ─────────────────────────────────────────────────
  security-scan:
    name: Trivy Security Scan
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Scan api-gateway image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # report findings without failing the pipeline (base-image CVEs are common)
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ─── Stage 4: Deploy to Production ──────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [build-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production          # requires manual approval in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/dlmp

            echo "▶ Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull \
              api-gateway user-service loan-service payment-service \
              notification-service report-service

            echo "▶ Rolling update (zero-downtime)..."
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps --build \
              api-gateway user-service loan-service payment-service \
              notification-service report-service

            echo "▶ Removing old images..."
            docker image prune -f

            echo "▶ Health check..."
            sleep 20
            curl -sf https://${{ secrets.PROD_DOMAIN }}/actuator/health | grep -q UP \
              && echo "✅ Deployment successful" \
              || (echo "❌ Health check failed" && exit 1)

  # ─── Stage 5: Notify on Failure ─────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    needs: [test, build-push, security-scan, deploy]
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send failure notification via SendGrid
        run: |
          curl -X POST "https://api.sendgrid.com/v3/mail/send" \
            -H "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "personalizations": [{"to": [{"email": "${{ secrets.ALERT_EMAIL }}"}]}],
              "from": {"email": "ci@${{ secrets.PROD_DOMAIN }}"},
              "subject": "❌ DLMP Deploy Failed — ${{ github.sha }}",
              "content": [{"type": "text/plain", "value": "CI/CD pipeline failed on commit ${{ github.sha }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]
            }'
