server:
  port: ${PORT:8082}

# Defaults target local development; Render overrides via env vars (see render.yaml).
spring:
  application:
    name: loan-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dlmp_loans}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&verifyServerCertificate=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:dlmp_user}
    password: ${MYSQL_PASSWORD:dlmp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: LoanPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # A single home-loan disbursement (up to 300 months tenure) inserts one
        # EmiSchedule row per installment; without batching that's ~300
        # sequential single-row INSERTs inside the disbursement transaction.
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    table: flyway_schema_history_loans   # unique table per service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Fail fast instead of blocking the single-threaded outbox relay scheduler
        # (and the Hikari connection its @Transactional holds) for the 60s Kafka
        # client default when broker/metadata is unreachable during a cold start.
        max.block.ms: 8000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    consumer:
      group-id: loan-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: RECORD
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
      ssl.truststore.type: PEM
      ssl.truststore.certificates: ${AIVEN_CA_CERT:}
      ssl.endpoint.identification.algorithm: ""

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false   # breaker lives on UserActivationChecker via Resilience4j annotation
      client:
        config:
          user-service:
            # Feign's own defaults (10s connect / 60s read) mean each of the 5
            # calls the breaker needs before it can open could individually take
            # up to 60s on a Render cold start. Fail faster so the breaker opens
            # sooner instead of stacking multiple 60s waits.
            connect-timeout: 5000
            read-timeout: 15000

dlmp:
  jwt:
    secret: ${JWT_SECRET}
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-key}
  outbox:
    relay-delay-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  # No resilience4j.retry block: isUserActive is called from within the
  # disbursement saga's fail-closed path, and no @Retry annotation is applied
  # anywhere in the codebase — a retry.instances block here previously gave a
  # false impression that calls were retried when they were not.

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.dlmp: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
