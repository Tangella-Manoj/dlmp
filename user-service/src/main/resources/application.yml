server:
  port: ${PORT:8081}

# Defaults target local development (docker-compose / start-services.sh).
# Production (Render + Aiven + Upstash) overrides every value via env vars — see render.yaml.
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dlmp_users}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&verifyServerCertificate=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:dlmp_user}
    password: ${MYSQL_PASSWORD:dlmp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: UserPool
      maximum-pool-size: 5       # shared free-tier MySQL — keep small
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    table: flyway_schema_history_users   # unique table per service in shared DB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
      ssl.truststore.type: PEM
      ssl.truststore.certificates: ${AIVEN_CA_CERT:}
      ssl.endpoint.identification.algorithm: ""

dlmp:
  jwt:
    secret: ${JWT_SECRET}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:86400000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-key}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.dlmp: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
