# ─────────────────────────────────────────────────────────────────────────────
#  DLMP v2.0  —  PRODUCTION Docker Compose
#  No dev-only tools (MailHog, Kafka-UI removed).
#  Real email via SendGrid. Kafka in KRaft mode (no Zookeeper).
#  Redis with password. Nginx reverse proxy with SSL.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  dlmp-internal:          # service mesh — not exposed to host
    driver: bridge
    internal: true
  dlmp-public:            # only gateway + nginx face outward
    driver: bridge

volumes:
  mysql-users-data:
  mysql-loans-data:
  mysql-payments-data:
  mysql-notifications-data:
  mysql-reports-data:
  redis-data:
  kafka-data:
  nginx-certs:

# ─── Reusable defaults ────────────────────────────────────────────────────────

x-mysql-defaults: &mysql-defaults
  image: mysql:8.0
  restart: unless-stopped
  networks: [dlmp-internal]
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
           "-p${MYSQL_ROOT_PASSWORD}"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 30s

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [dlmp-internal]
  environment: &app-env
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_SSL: "false"
    KAFKA_SERVERS: kafka:9092
    KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    KAFKA_SASL_MECHANISM: PLAIN
    KAFKA_SASL_JAAS: ""
    AIVEN_CA_CERT: ""
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_SSL_ENABLED: "false"
    JWT_SECRET: ${JWT_SECRET}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
    JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ─── Kafka (KRaft mode — no Zookeeper) ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dlmp-kafka
    restart: unless-stopped
    networks: [dlmp-internal]
    ports:
      - "9092:9092"          # internal only — not exposed via Nginx
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ─── Redis (with password) ────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dlmp-redis
    restart: unless-stopped
    networks: [dlmp-internal]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── MySQL Databases (database-per-service) ───────────────────────────────
  mysql-users:
    <<: *mysql-defaults
    container_name: dlmp-mysql-users
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dlmp_users
    volumes:
      - mysql-users-data:/var/lib/mysql

  mysql-loans:
    <<: *mysql-defaults
    container_name: dlmp-mysql-loans
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dlmp_loans
    volumes:
      - mysql-loans-data:/var/lib/mysql

  mysql-payments:
    <<: *mysql-defaults
    container_name: dlmp-mysql-payments
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dlmp_payments
    volumes:
      - mysql-payments-data:/var/lib/mysql

  mysql-notifications:
    <<: *mysql-defaults
    container_name: dlmp-mysql-notifications
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dlmp_notifications
    volumes:
      - mysql-notifications-data:/var/lib/mysql

  mysql-reports:
    <<: *mysql-defaults
    container_name: dlmp-mysql-reports
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dlmp_reports
    volumes:
      - mysql-reports-data:/var/lib/mysql

  # ─── Application Services ─────────────────────────────────────────────────
  user-service:
    <<: *app-defaults
    container_name: dlmp-user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      <<: *app-env
      MYSQL_HOST: mysql-users
      MYSQL_PORT: 3306
      MYSQL_DB: dlmp_users
      MAIL_HOST: smtp.sendgrid.net
      MAIL_PORT: 587
      MAIL_USERNAME: apikey
      MAIL_PASSWORD: ${SENDGRID_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DLMP Platform}
    depends_on:
      mysql-users:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  loan-service:
    <<: *app-defaults
    container_name: dlmp-loan-service
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    environment:
      <<: *app-env
      MYSQL_HOST: mysql-loans
      MYSQL_PORT: 3306
      MYSQL_DB: dlmp_loans
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      mysql-loans:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service:
    <<: *app-defaults
    container_name: dlmp-payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *app-env
      MYSQL_HOST: mysql-payments
      MYSQL_PORT: 3306
      MYSQL_DB: dlmp_payments
    depends_on:
      mysql-payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    <<: *app-defaults
    container_name: dlmp-notification-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *app-env
      MYSQL_HOST: mysql-notifications
      MYSQL_PORT: 3306
      MYSQL_DB: dlmp_notifications
      MAIL_HOST: smtp.sendgrid.net
      MAIL_PORT: 587
      MAIL_USERNAME: apikey
      MAIL_PASSWORD: ${SENDGRID_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DLMP Platform}
    depends_on:
      mysql-notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  report-service:
    <<: *app-defaults
    container_name: dlmp-report-service
    build:
      context: .
      dockerfile: report-service/Dockerfile
    environment:
      <<: *app-env
      MYSQL_HOST: mysql-reports
      MYSQL_PORT: 3306
      MYSQL_DB: dlmp_reports
    depends_on:
      mysql-reports:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    <<: *app-defaults
    container_name: dlmp-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    networks: [dlmp-internal, dlmp-public]
    environment:
      <<: *app-env
      USER_SERVICE_URL: http://user-service:8081
      LOAN_SERVICE_URL: http://loan-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      REPORT_SERVICE_URL: http://report-service:8085
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Nginx Reverse Proxy (SSL termination) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: dlmp-nginx
    restart: unless-stopped
    networks: [dlmp-public]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      api-gateway:
        condition: service_healthy

  # ─── Certbot (SSL cert renewal) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: dlmp-certbot
    volumes:
      - nginx-certs:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  # ─── Monitoring (always on in production) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: dlmp-prometheus
    restart: unless-stopped
    networks: [dlmp-internal]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: dlmp-grafana
    restart: unless-stopped
    networks: [dlmp-internal, dlmp-public]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-yourdomain.com}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.sendgrid.net:587
      GF_SMTP_USER: apikey
      GF_SMTP_PASSWORD: ${SENDGRID_API_KEY}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
