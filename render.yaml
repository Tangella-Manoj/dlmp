# ─────────────────────────────────────────────────────────────────────────────
#  DLMP v2.0 — Render Blueprint (free tier)
#
#  External managed services (create these first — see docs/RENDER_DEPLOYMENT.md):
#    • Aiven MySQL   → one database (defaultdb), all services share it with
#                      per-service Flyway history tables
#    • Aiven Kafka   → topics: dlmp.loan.events, dlmp.payment.events, dlmp.user.events
#    • Upstash Redis → TLS enabled
#
#  All `sync: false` vars must be filled in the Render dashboard:
#    MYSQL_PASSWORD, REDIS_PASSWORD, KAFKA_SASL_JAAS, AIVEN_CA_CERT,
#    JWT_SECRET (same value on every service!), INTERNAL_API_KEY (same on
#    user+loan), MAIL_* (optional), ADMIN_EMAIL/ADMIN_PASSWORD (optional).
# ─────────────────────────────────────────────────────────────────────────────

services:

  - type: web
    name: dlmp-user-service
    runtime: docker
    dockerfilePath: user-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MYSQL_HOST
        value: dlmp-db-dlmp.j.aivencloud.com
      - key: MYSQL_PORT
        value: "24351"
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: KAFKA_SERVERS
        value: dlmp-kafka-dlmp.b.aivencloud.com:24364
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: dlmp-loan-service
    runtime: docker
    dockerfilePath: loan-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MYSQL_HOST
        value: dlmp-db-dlmp.j.aivencloud.com
      - key: MYSQL_PORT
        value: "24351"
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: KAFKA_SERVERS
        value: dlmp-kafka-dlmp.b.aivencloud.com:24364
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: USER_SERVICE_URL
        value: https://dlmp-user-service.onrender.com

  - type: web
    name: dlmp-payment-service
    runtime: docker
    dockerfilePath: payment-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MYSQL_HOST
        value: dlmp-db-dlmp.j.aivencloud.com
      - key: MYSQL_PORT
        value: "24351"
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: KAFKA_SERVERS
        value: dlmp-kafka-dlmp.b.aivencloud.com:24364
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: dlmp-notification-service
    runtime: docker
    dockerfilePath: notification-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MYSQL_HOST
        value: dlmp-db-dlmp.j.aivencloud.com
      - key: MYSQL_PORT
        value: "24351"
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: KAFKA_SERVERS
        value: dlmp-kafka-dlmp.b.aivencloud.com:24364
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp.sendgrid.net
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: apikey
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: DLMP Platform
      - key: MAIL_ENABLED
        value: "false"

  - type: web
    name: dlmp-report-service
    runtime: docker
    dockerfilePath: report-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MYSQL_HOST
