      - key: NOTIFICATION_SERVICE_URL
        value: https://dlmp-notification-service.onrender.com
      - key: REPORT_SERVICE_URL
        value: https://dlmp-report-service.onrender.com
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://dlmp-gateway.onrender.com
