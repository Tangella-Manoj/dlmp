      - key: MYSQL_PORT
        value: "24351"
      - key: MYSQL_DB
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: KAFKA_SERVERS
        value: dlmp-kafka-dlmp.b.aivencloud.com:24364
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: AIVEN_CA_CERT
