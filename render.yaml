        value: dlmp-user-service.onrender.com
      - key: LOAN_SERVICE_HOST
        value: dlmp-loan-service.onrender.com
      - key: PAYMENT_SERVICE_HOST
        value: dlmp-payment-service.onrender.com
      - key: NOTIFICATION_SERVICE_HOST
        value: dlmp-notification-service.onrender.com
      - key: REPORT_SERVICE_HOST
        value: dlmp-report-service.onrender.com
      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://dlmp-gateway.onrender.com
