      - key: REDIS_HOST
        value: happy-sunbird-140234.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: KAFKA_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_SERVICE_URL
        value: https://dlmp-user-service.onrender.com

  - type: web
    name: dlmp-payment-service
    runtime: docker
