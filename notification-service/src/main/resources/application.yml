server:
  port: ${PORT:8084}

# Defaults target local development; Render overrides via env vars (see render.yaml).
spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dlmp_notifications}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&verifyServerCertificate=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:dlmp_user}
    password: ${MYSQL_PASSWORD:dlmp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NotifPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_notification

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: RECORD
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
      ssl.truststore.type: PEM
      ssl.truststore.certificates: ${AIVEN_CA_CERT:}
      ssl.endpoint.identification.algorithm: ""

  # ── Email (Brevo/SendGrid/Gmail SMTP — optional, non-blocking) ─────────────
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

dlmp:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@dlmp.com}
    from-name: ${MAIL_FROM_NAME:DLMP Platform}
    enabled: ${MAIL_ENABLED:false}

management:
  health:
    mail:
      enabled: false   # email is best-effort; an SMTP outage must not fail the health check
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.dlmp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
